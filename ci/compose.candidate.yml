services:
  api:
    image: ${CANDIDATE_IMAGE:?Candidate image is required}
    init: true
    mem_limit: 256m
    cpus: 0.5
    networks: [candidate, backend]
    environment:
      MONGO_DATABASE: ${MONGO_DATABASE:-us_accidents}
      MONGO_APP_USERNAME: ${MONGO_APP_USERNAME:-accidents_app}
      MONGO_APP_PASSWORD: ${MONGO_APP_PASSWORD:?Required}
    healthcheck:
      test: [CMD, python, /app/scripts/smoke_api.py, 'http://127.0.0.1:5000/health', --attempts, '1']
      interval: 5s
      timeout: 6s
      retries: 5
      start_period: 5s
networks:
  candidate: {internal: true}
  backend: {external: true, name: parcialbigdata_backend}
